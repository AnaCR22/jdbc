# TCONTRACTS
TCONTRACTS_ADD = INSERT INTO TContracts \
				(id, mechanic_id, professionalGroup_id, contractType_id, \
    			annualBaseSalary, taxRate, settlement, state, startDate, endDate, \
    			version, createdAt, updatedAt, entityState) \
    			VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TCONTRACTS_DELETE = DELETE FROM TContracts WHERE id = ?
TCONTRACTS_UPDATE = UPDATE TContracts \
   					SET annualBaseSalary = ?, endDate = ?, taxRate = ?, version = ?, updatedAt = ?, settlement = ?, state = ? \
    				WHERE id = ?
TCONTRACTS_FINDBYID = SELECT * FROM TContracts WHERE id = ?    				
TCONTRACTS_FIND_IN_FORCE_BY_MECHANIC = SELECT * FROM TContracts WHERE mechanic_id = ? AND state = 'IN_FORCE'
TCONTRACTS_FIND_IN_FORCE = SELECT * FROM TContracts WHERE state = 'IN_FORCE'
TCONTRACTS_FINDBYMECHANICID = SELECT * FROM TContracts WHERE mechanic_id = ?
TCONTRACTS_FINDALL = SELECT * FROM TContracts
TCONTRACTS_COUNT_BY_TYPE = SELECT COUNT(*) FROM TContracts WHERE contractType_id = ?
TCONTRACTS_COUNT_BY_PROFESSIONALGROUP = SELECT COUNT(*) FROM TContracts WHERE professionalGroup_id = ?

# TCONTRACTTYPES
TCONTRACTTYPES_FINDBYNAME = SELECT * FROM TContractTypes WHERE name = ?
TCONTRACTTYPES_FINDBYID = SELECT * FROM TContractTypes WHERE id = ?
TCONTRACTTYPES_ADD = INSERT INTO TContractTypes \
    (id, name, compensationDaysPerYear, version, createdAt, updatedAt, entityState) \
    VALUES (?, ?, ?, ?, ?, ?, ?)
TCONTRACTTYPES_DELETE = DELETE FROM TContractTypes WHERE id = ?
TCONTRACTTYPES_UPDATE = UPDATE TContractTypes \
					    SET compensationDaysPerYear = ?, version = version + 1, updatedAt = ? \
					    WHERE name = ?
TCONTRACTTYPES_FINDALL = SELECT * FROM TContractTypes

# TINTERVENTIONS
TINTERVENTIONS_FINDBYMECHANICID = SELECT * FROM TInterventions WHERE mechanic_id = ?
TINTERVENTIONS_FINDBYCONTRACTID = SELECT * FROM TInterventions WHERE contract_id = ?

# TINVOICES
TINVOICES_SELECT_LAST_NUMBER = SELECT MAX(number) FROM TInvoices
TINVOICES_INSERT = INSERT INTO TInvoices \
                   (id, number, date, vat, amount, state, version, \
                   createdAt, updatedAt, entityState) \
                   VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

# TMECHANICS
TMECHANICS_ADD = INSERT INTO TMechanics(id, nif, name, surname, version, \
                 createdAt, updatedAt, entityState) \
                 values (?, ?, ?, ?, ?, ?, ?, ?)
TMECHANICS_DELETE = DELETE FROM TMechanics WHERE id = ?
TMECHANICS_FINDBYNIF = SELECT id, nif, name, surname, version from TMechanics \
                       WHERE nif = ?
TMECHANICS_FINDBYID = SELECT id, nif, name, surname, version from TMechanics \
                       WHERE id = ?
TMECHANICS_FINDALL = SELECT id, nif, name, surname, version from TMechanics
TMECHANICS_UPDATE = UPDATE TMechanics \
                    set name = ?, surname = ?, version = version+1, \
                    updatedat = ? WHERE id = ?

#TPAYROLLS
TPAYROLLS_COUNTBYCONTRACT = SELECT COUNT(*) FROM TPayrolls WHERE contract_id = ?
TPAYROLLS_FINDBYCONTRACTID_LAST12 = SELECT * FROM TPayrolls \
							WHERE contract_id = ? ORDER BY date DESC LIMIT 12

